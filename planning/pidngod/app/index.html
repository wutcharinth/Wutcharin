    case "file": c.filed[el.dataset.k] = "filed"; log(`บันทึกว่ายื่น ${el.dataset.k === "pp30" ? "ภ.พ.30" : el.dataset.k === "pp36" ? "ภ.พ.36" : el.dataset.k} แล้ว`); render(); break;

    case "unfile": delete c.filed[el.dataset.k]; render(); break;
    case "filePay": c.filed.pnd1 = "filed"; c.filed.sso = "filed"; log("บันทึกว่ายื่น ภ.ง.ด.1 และ สปส.1-10 แล้ว"); render(); break;
    case "unfilePay": delete c.filed.pnd1; delete c.filed.sso; render(); break;
    case "payrollIn": c.payroll = { emp: 5, pnd1: 0, sso: 4850, status: "ready" }; log("นำเข้าสรุปเงินเดือน ต.ค. 2569 (5 คน)"); toast("นำเข้าสรุปเงินเดือนแล้ว · ไม่มีพนักงานถึงเกณฑ์ภาษี · สปส. 4,850.00"); render(); break;
    case "issueCert": if (d) { c.certs[d.id] = `2569/${String(c.certSeq++).padStart(4, "0")}`; log(`ออก 50 ทวิ เลขที่ ${c.certs[d.id]} ให้ ${d.vendor} ภาษี ${fmt(d.wht)}`); render(); modal(certHTML(c, d)); } break;
    case "viewCert": if (d) modal(certHTML(c, d)); break;
    case "closeModal": $("#modal").hidden = true; break;
    case "dlWht": { const f = el.dataset.f, ds = c.docs.filter(x => x.wht > 0 && x.status === "confirmed" && AN[x.id].whtForm === f); const rows = [["ลำดับ", "เลขประจำตัวผู้เสียภาษี", "สาขา", "ชื่อผู้มีเงินได้", "วันที่จ่าย", "ประเภทเงินได้", "อัตราภาษี", "จำนวนเงินที่จ่าย", "ภาษีที่หัก", "เงื่อนไข"]]; ds.forEach((x, i) => rows.push([i + 1, x.tin, "00000", x.vendor, beSlash(x.date), INCOME_TYPE(x), Math.round(x.wht / x.base * 100), x.base.toFixed(2), x.wht.toFixed(2), 1])); if (await saveFile(`${f.replace(/\./g, "")}_attach_${c.slug}_2569-10.csv`, csvOf(rows))) log(`ส่งออกไฟล์แนบ ${f} ${ds.length} ราย`); break; }
    case "dlPurch": { const v = vatCalc(c), rows = [["ลำดับ", "วันที่", "เลขที่", "ผู้ขาย", "เลขประจำตัวผู้เสียภาษี", "สาขา", "มูลค่า", "ภาษีซื้อ"]]; v.conf.forEach((x, i) => rows.push([i + 1, beSlash(x.date), x.no, x.vendor, x.tin, "สำนักงานใหญ่", x.base.toFixed(2), x.vat.toFixed(2)])); if (await saveFile(`purchase_tax_report_${c.slug}_2569-10.csv`, csvOf(rows))) log(`ส่งออกรายงานภาษีซื้อ ${v.conf.length} ใบ`); break; }
    case "previewReq": { const r = R().find(x => x.key === el.dataset.k); if (r) $("#reqPrev").innerHTML = lineMsg(c, r); break; }
    case "sendReq": { const r = R().find(x => x.key === el.dataset.k); if (r) { c.requests[r.key] = Date.now(); if (r.key.startsWith("bank:")) { const b = c.bank.find(x => "bank:" + x.id === r.key); b.manual = "none"; b.requested = true; } if (r.key.startsWith("doc:")) { const x = c.docs.find(y => "doc:" + y.id === r.key); x.status = "requested"; } log(`ส่งคำขอทาง LINE: ${r.what}`); toast("ส่งทาง LINE แล้ว (สาธิต)"); render(); } break; }
    case "sendAll": { const rs = R().filter(r => !c.requests[r.key]); rs.forEach(r => { c.requests[r.key] = Date.now(); if (r.key.startsWith("bank:")) { const b = c.bank.find(x => "bank:" + x.id === r.key); b.manual = "none"; b.requested = true; } if (r.key.startsWith("doc:")) { c.docs.find(y => "doc:" + y.id === r.key).status = "requested"; } }); log(`ส่งคำขอเอกสารทาง LINE ${rs.length} รายการ`); toast(`ส่ง ${rs.length} คำขอทาง LINE แล้ว (สาธิต)`); render(); break; }
    case "closePeriod": c.closed = true; log("ปิดงวด ต.ค. 2569 และล็อกข้อมูล"); toast("ปิดงวดแล้ว ข้อมูลถูกล็อก"); render(); break;
    case "reopen": c.closed = false; log("เปิดงวด ต.ค. 2569 อีกครั้ง"); render(); break;
    case "sampleCsv": $("#csvText").value = SAMPLE_CSV; break;
    case "parse": parsed = parseTable($("#csvText").value); $("#mapOut").innerHTML = parsed ? mapHTML(parsed) : `<p class="muted">ไม่พบข้อมูล</p>`; break;
    case "doImport": if (parsed) { const m = parsed.map, g = (r, f) => f in m ? (r[m[f]] || "").trim() : ""; let n = 0; for (const r of parsed.rows) { const vendor = g(r, "vendor"); if (!vendor) continue; const vat = numv(g(r, "vat")); addDoc(c, { date: toIso(g(r, "date")), no: g(r, "no") || "-", vendor, tin: g(r, "tin").replace(/\D/g, ""), desc: g(r, "desc") || "-", base: numv(g(r, "base")), vat, wht: numv(g(r, "wht")), type: vat > 0 ? "full" : "cash", src: "Excel" }); n++; } parsed = null; log(`นำเข้า ${n} รายการจากตาราง`); toast(`นำเข้า ${n} รายการ · กดตรวจและจัดประเภทเพื่อประมวลผล`); S.tab = "review"; render(); } break;
    case "addManual": { const base = numv($("#mBase").value), vendor = $("#mVendor").value.trim(); if (!vendor || !base) { toast("ใส่ชื่อผู้ขายและมูลค่าก่อน"); break; } const type = $("#mType").value, vIn = $("#mVat").value.trim(); const vat = vIn === "" ? (type === "full" || type === "etax" || type === "abb" ? r2(base * 0.07) : 0) : numv(vIn); addDoc(c, { date: $("#mDate").value || "2026-10-31", no: $("#mNo").value.trim() || "-", vendor, tin: $("#mTin").value.replace(/\D/g, ""), desc: $("#mDesc").value.trim() || "-", base, vat, wht: numv($("#mWht").value), type, src: "เพิ่มเอง" }); log(`เพิ่มเอกสาร ${vendor} ด้วยมือ`); toast("เพิ่มเข้าคิวตรวจแล้ว"); S.tab = "review"; render(); break; }
    case "importCoa": { const lines = $("#coaText").value.split("\n").map(l => l.split(/[,\t]/).map(s => s.trim())).filter(a => a[0] && a[1]); if (!lines.length) { toast("ใส่ รหัส,ชื่อบัญชี บรรทัดละหนึ่งบัญชี"); break; } c.coa = lines.map(([code, name]) => { const old = c.coa.find(a => a[0] === code); return [code, name, old ? old[2] : name.replace(/^ค่า/, "").replace(/[()]/g, "").split(/\s+/)[0]]; }); if (!c.coa.find(a => a[0] === c.miscCode)) c.miscCode = c.coa[c.coa.length - 1][0]; if (!c.coa.find(a => a[0] === c.assetCode)) c.assetCode = c.coa[0][0]; log(`นำเข้าผังบัญชี ${c.coa.length} รหัส`); toast(`นำเข้าผังบัญชี ${c.coa.length} รหัส`); render(); break; }
    case "saveRules": c.capThreshold = +$("#capIn").value || 0; c.assetCode = $("#assetIn").value; log(`ตั้งกฎสินทรัพย์ ${c.capThreshold} บาท → ${c.assetCode}`); toast("บันทึกกฎแล้ว รหัสที่เสนอคำนวณใหม่"); render(); break;
    case "forget": delete c.vendorRules[el.dataset.v]; log(`ลบกฎผู้ขาย ${el.dataset.v}`); render(); break;
    case "fmt": expFmt = el.dataset.f; render(); break;
    case "download": { const rows = exportRows(); if (await saveFile(`${expFmt === "peak" ? "PEAK_import" : "journal"}_${c.slug}_2569-10.csv`, csvOf(buildRows(expFmt)))) { rows.forEach(x => x.exported = true); log(`ส่งออก${expFmt === "peak" ? "ไฟล์นำเข้า PEAK" : "สมุดรายวัน"} ${rows.length} รายการ`); render(); } break; }
    case "markExported": { const rows = exportRows(); rows.forEach(x => x.exported = true); log(`ทำเครื่องหมายส่งออกแล้ว ${rows.length} รายการ`); toast(`ทำเครื่องหมาย ${rows.length} รายการว่าส่งออกแล้ว`); render(); break; }
    case "unexport": c.docs.forEach(x => x.exported = false); render(); break;
  }
});
function addDoc(c, o) { c.docs.push({ id: c.id + "-" + (c.docs.length + 1), buyerTin: c.tin, vatReg: true, status: "new", code: null, exported: false, ...o }); }
document.addEventListener("change", async e => {
  const el = e.target, c = C();
  if (el.id === "clientSel") { S.clientId = el.value; S.view = "client"; S.tab = "dash"; S.sel = null; S.filter = "all"; render(); }
  else if (el.dataset && el.dataset.act === "code") { const d = c.docs.find(x => x.id === el.dataset.id); if (d) setCode(c, d, el.value); }
  else if (el.dataset && el.dataset.act === "bankPick" && el.value) { const b = c.bank.find(x => x.id === el.dataset.b); b.manual = el.value; log(`จับคู่ ${b.desc} กับเอกสาร ${c.docs.find(x => x.id === el.value).vendor} ด้วยมือ`); render(); }
  else if (el.dataset && el.dataset.act === "salesIn") { c.sales[el.dataset.k] = numv(el.value); log(`แก้ยอดขาย ภ.พ.30 (${el.dataset.k}) เป็น ${fmt(c.sales[el.dataset.k])}`); render(); }
  else if (el.id === "csvFile" && el.files && el.files[0]) { const fr = new FileReader(); fr.onload = () => { $("#csvText").value = String(fr.result); parsed = parseTable(fr.result); $("#mapOut").innerHTML = parsed ? mapHTML(parsed) : ""; }; fr.readAsText(el.files[0], "utf-8"); }
  else if (el.id === "imgFile" && el.files && el.files[0]) readImage(c, el.files[0]);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) { $("#modal").hidden = true; return; }
  if (S.view !== "client" || S.tab !== "review" || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const list = visibleDocs(), i = list.findIndex(d => d.id === S.sel);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); S.sel = (list[i + 1] || list[i] || {}).id; render(); $("#revT tr.sel")?.scrollIntoView({ block: "nearest" }); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); S.sel = (list[i - 1] || list[i] || {}).id; render(); $("#revT tr.sel")?.scrollIntoView({ block: "nearest" }); }
  else if (e.key === "Enter") { const c = C(), d = c.docs.find(x => x.id === S.sel); if (d && !c.closed && d.status === "ready" && !AN[d.id].dupOf && !AN[d.id].blocks) { e.preventDefault(); confirmDoc(c, d); toast(`ยืนยันแล้ว · ${d.vendor} → ${d.code}`); nextSel(); render(); } }
});
async function askAI(c, d) {
  const out = $("#aiOut"); if (!out || !sampleFn) return; out.textContent = "กำลังคิด…";
  const prompt = `You classify Thai business expenses into the client's own chart of accounts.\nClient business: ${c.biz}. Asset capitalisation threshold: ${c.capThreshold} THB.\nChart of accounts (code: name):\n${c.coa.map(a => `${a[0]}: ${a[1]}`).join("\n")}\n\nDocument:\nvendor: ${d.vendor}\ndescription: ${d.desc}\namount before VAT: ${d.base} THB, VAT: ${d.vat} THB, document type: ${d.type}\n\nReply ONLY with JSON: {"code": "<one code from the list>", "confidence": <0-100>, "reason_th": "<one short sentence in Thai>"}`;
  try { const r = await sampleFn.json(prompt, { modelTier: "quick" }); if (!r || !c.coa.find(a => a[0] === String(r.code))) { out.textContent = "AI ตอบรหัสที่ไม่อยู่ในผังบัญชี จึงไม่นำมาใช้"; return; }
    out.innerHTML = `AI เสนอ <b>${esc(r.code)} ${esc(coaName(c, String(r.code)))}</b> (${esc(r.confidence)}%)<br>${esc(r.reason_th || "")}<br><button class="btn sm" type="button" data-act="pick" data-id="${d.id}" data-code="${esc(r.code)}" style="margin-top:6px">ใช้รหัสนี้</button>`;
  } catch (err) { out.textContent = err && err.code === "not_granted" ? "ไม่ได้อนุญาตให้ใช้ AI" : err && err.code === "rate_limited" ? "เรียกใช้ถี่เกินไป ลองใหม่อีกครู่" : "เรียก AI ไม่สำเร็จ ใช้รหัสที่ระบบเสนอได้ตามปกติ"; }
}
async function readImage(c, file) {
  const out = $("#imgOut"); out.textContent = "AI กำลังอ่านรูป อาจใช้เวลาครู่หนึ่ง…";
  const prompt = `This image is a Thai receipt or tax invoice. Extract fields. Reply ONLY with JSON: {"type": "full"|"abb"|"cash"|"etax"|"foreign", "date": "YYYY-MM-DD (Gregorian; convert Buddhist Era by subtracting 543)", "no": "", "vendor": "", "tin": "13 digits or empty", "desc": "short Thai summary of items", "base": number (amount before VAT), "vat": number, "wht": 0}. "full" = full tax invoice (ใบกำกับภาษีเต็มรูป), "abb" = abbreviated tax invoice (ใบกำกับภาษีอย่างย่อ), "cash" = receipt without VAT.`;
  try { const r = await sampleFn.json(prompt, { images: [file], modelTier: "default" });
    if (!r || !r.vendor) { out.textContent = "อ่านรูปไม่ออก ลองรูปที่ชัดขึ้น"; return; }
    addDoc(c, { date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : "2026-10-31", no: String(r.no || "-"), vendor: String(r.vendor), tin: String(r.tin || "").replace(/\D/g, ""), desc: String(r.desc || "-"), base: +r.base || 0, vat: +r.vat || 0, wht: +r.wht || 0, type: ["full", "abb", "cash", "etax", "foreign"].includes(r.type) ? r.type : "cash", src: "รูป · AI" });
    log(`AI อ่านรูปใบเสร็จ ${r.vendor}`); toast("AI อ่านรูปแล้ว เข้าคิวตรวจ"); S.tab = "review"; render();
  } catch (err) { out.textContent = err && err.code === "not_granted" ? "ไม่ได้อนุญาตให้ใช้ AI" : "อ่านรูปไม่สำเร็จ ลองอีกครั้ง"; }
}
render();
})();

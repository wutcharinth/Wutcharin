    <div class="card-b form"><b style="font-size:.85rem">นำเข้าผังบัญชีที่ส่งออกจาก ${c.sw}</b><textarea id="coaText" style="min-height:90px" placeholder="รหัส,ชื่อบัญชี (บรรทัดละหนึ่งบัญชี)"></textarea><div><button class="btn" type="button" data-act="importCoa">แทนที่ผังบัญชี</button></div></div>
  </div>
  <div><div class="card"><div class="card-h"><h2>กฎของลูกค้า</h2></div><div class="card-b form">
    <label>บันทึกเป็นสินทรัพย์เมื่อราคาตั้งแต่ (บาท) <input type="number" id="capIn" value="${c.capThreshold}" min="0" step="500" style="width:9em"></label>
    <label>รหัสบัญชีสินทรัพย์ <select id="assetIn">${c.coa.map(a => `<option value="${a[0]}" ${a[0] === c.assetCode ? "selected" : ""}>${a[0]} ${esc(a[1])}</option>`).join("")}</select></label>
    <div><button class="btn" type="button" data-act="saveRules">บันทึกกฎ</button></div></div></div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h2>ผู้ขายที่ระบบจำไว้</h2><span class="muted">${vr.length} ราย</span></div>
    <div class="scroll-x"><table class="t"><thead><tr><th>ผู้ขาย</th><th>รหัส</th><th>ที่มา</th><th></th></tr></thead><tbody>${vr.length ? vr.map(([v, r]) => `<tr><td>${esc(v)}</td><td class="num">${r.code} <small class="muted">${esc(coaName(c, r.code))}</small></td><td>${r.src === "edit" ? `<span class="pill b">ผู้ทำบัญชีกำหนด</span>` : `<span class="pill">ประวัติ ${r.n} ครั้ง</span>`}</td><td><button class="btn sm" type="button" data-act="forget" data-v="${esc(v)}">ลืม</button></td></tr>`).join("") : `<tr><td colspan="4"><div class="empty">ยังไม่มี</div></td></tr>`}</tbody></table></div></div></div>
  </div>`;
}

/* Export */
let expFmt = "peak";
function exportRows() { const c = C(); return c.docs.filter(d => d.status === "confirmed" && !d.exported && !AN[d.id].dupOf); }
function buildCsv(fmtName) {
  const c = C(), rows = exportRows();
  const q = v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  let out = [];
  if (fmtName === "peak") {
    out.push(["วันที่เอกสาร", "เลขที่เอกสาร", "ชื่อผู้ขาย", "เลขประจำตัวผู้เสียภาษี", "รหัสบัญชี", "ชื่อบัญชี", "รายละเอียด", "มูลค่า", "ภาษีซื้อ", "ภาษีหัก ณ ที่จ่าย", "ยอดชำระ"]);
    for (const d of rows) { const a = AN[d.id]; const v = a.claimVat ? d.vat : 0; out.push([beSlash(d.date), d.no, d.vendor, d.tin, a.code, coaName(c, a.code), d.desc, a.expense.toFixed(2), v.toFixed(2), d.wht.toFixed(2), (a.expense + v - d.wht).toFixed(2)]); }
  } else {
    out.push(["วันที่", "เลขที่", "รหัสบัญชี", "ชื่อบัญชี", "เดบิต", "เครดิต", "คำอธิบาย"]);
    for (const d of rows) { const a = AN[d.id], v = a.claimVat ? d.vat : 0, dt = beSlash(d.date);
      out.push([dt, d.no, a.code, coaName(c, a.code), a.expense.toFixed(2), "", `${d.vendor} ${d.desc}`]);
      if (v) out.push([dt, d.no, c.ctrl.vat, "ภาษีซื้อ", v.toFixed(2), "", ""]);
      if (d.wht) out.push([dt, d.no, c.ctrl.wht, "ภาษีหัก ณ ที่จ่ายค้างจ่าย", "", d.wht.toFixed(2), a.whtForm]);
      out.push([dt, d.no, c.ctrl.ap, "เจ้าหนี้", "", (a.expense + v - d.wht).toFixed(2), d.vendor]); }
  }
  return "﻿" + out.map(r => r.map(q).join(",")).join("\n");
}
function vExport() {
  const c = C(), rows = exportRows(), done = c.docs.filter(d => d.exported);
  let tE = 0, tV = 0, tW = 0; rows.forEach(d => { const a = AN[d.id]; tE += a.expense; tV += a.claimVat ? d.vat : 0; tW += d.wht; });
  return `<div class="card"><div class="card-h"><h2>ส่งออก · ${esc(c.name)}</h2>
    <div class="chips"><button type="button" data-act="fmt" data-f="peak" aria-pressed="${expFmt === "peak"}">ไฟล์นำเข้า PEAK (ตัวอย่างโครงสร้าง)</button><button type="button" data-act="fmt" data-f="jv" aria-pressed="${expFmt === "jv"}">สมุดรายวัน เดบิต เครดิต</button><button type="button" disabled title="แผนงาน">Express · แผนงาน</button></div></div>
  <div class="card-b">
    ${rows.length ? `<p style="margin:0 0 10px">${rows.length} รายการที่ยืนยันแล้วและยังไม่เคยส่งออก · ค่าใช้จ่าย <b class="num">${fmt(tE)}</b> · ภาษีซื้อ <b class="num">${fmt(tV)}</b> · หัก ณ ที่จ่าย <b class="num">${fmt(tW)}</b></p>
    <div class="scroll-x"><table class="t"><thead><tr>${(expFmt === "peak" ? ["วันที่", "เลขที่", "ผู้ขาย", "รหัสบัญชี", "มูลค่า", "ภาษีซื้อ", "หัก ณ ที่จ่าย", "ยอดชำระ"] : ["วันที่", "เลขที่", "รหัสบัญชี", "เดบิต", "เครดิต"]).map((h, i) => `<th class="${i > 3 || (expFmt === "jv" && i > 2) ? "r" : ""}">${h}</th>`).join("")}</tr></thead><tbody>
    ${expFmt === "peak" ? rows.map(d => { const a = AN[d.id], v = a.claimVat ? d.vat : 0; return `<tr><td>${beSlash(d.date)}</td><td>${esc(d.no)}</td><td>${esc(d.vendor)}</td><td>${a.code} ${esc(coaName(c, a.code))}</td><td class="r num">${fmt(a.expense)}</td><td class="r num">${fmt(v)}</td><td class="r num">${fmt(d.wht)}</td><td class="r num">${fmt(a.expense + v - d.wht)}</td></tr>`; }).join("")
      : rows.map(d => { const a = AN[d.id], v = a.claimVat ? d.vat : 0, L = [[a.code, a.expense, 0], v ? [c.ctrl.vat, v, 0] : null, d.wht ? [c.ctrl.wht, 0, d.wht] : null, [c.ctrl.ap, 0, a.expense + v - d.wht]].filter(Boolean); return L.map((l, i) => `<tr><td>${i ? "" : beSlash(d.date)}</td><td>${i ? "" : esc(d.no)}</td><td>${l[0]} ${esc(coaName(c, l[0]) === "?" ? "" : coaName(c, l[0]))}</td><td class="r num">${l[1] ? fmt(l[1]) : ""}</td><td class="r num">${l[2] ? fmt(l[2]) : ""}</td></tr>`).join(""); }).join("")}
    </tbody></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${downloadsNS ? `<button class="btn pri" type="button" data-act="download">ดาวน์โหลด CSV</button>` : ""}<button class="btn" type="button" data-act="copyCsv">คัดลอก CSV</button><button class="btn" type="button" data-act="markExported">ทำเครื่องหมายว่าส่งออกแล้ว</button></div>
    <p class="muted" style="font-size:.76rem;margin:10px 0 0">คอลัมน์ของไฟล์ PEAK เป็นตัวอย่างโครงสร้าง จะตั้งให้ตรงกับแม่แบบนำเข้าที่สำนักงานใช้จริง รายการที่ส่งออกแล้วจะไม่ถูกส่งซ้ำ ภาษีซื้อต้องห้ามรวมอยู่ในมูลค่าค่าใช้จ่ายแล้ว</p>`
    : `<div class="empty">ยังไม่มีรายการที่ยืนยันแล้วและรอส่งออก<br>ไปที่หน้าตรวจและจัดประเภท แล้วกดยืนยันเอกสาร</div>`}
    ${done.length ? `<div class="sec"><h3>ส่งออกแล้ว ${done.length} รายการ</h3><button class="btn sm" type="button" data-act="unexport">ยกเลิกสถานะส่งออกทั้งหมด (สาธิต)</button></div>` : ""}
  </div></div>`;
}

/* ---------- Actions ---------- */
function learn(c, d, code, src) { const k = vkey(d), r = c.vendorRules[k]; c.vendorRules[k] = { code, n: r && r.code === code ? r.n + 1 : 1, src: src || (r && r.code === code ? r.src : "hist") }; }
function confirmDoc(c, d) { const a = AN[d.id]; if (a.dupOf) return; d.status = "confirmed"; d.code = d.code || a.code; learn(c, d, d.code, d.codeEdited ? "edit" : null); }
async function runProcess() {
  const c = C(), news = c.docs.filter(d => d.status === "new");
  if (!news.length) return;
  S.tab = "review"; S.filter = "all"; render();
  const bar = $("#runProg"); if (bar) bar.hidden = false;
  for (let i = 0; i < news.length; i++) {
    news[i].status = "ready"; S.sel = news[i].id;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduce) await new Promise(r => setTimeout(r, 160));
    render(); const row = $(`#revT tr[data-id="${news[i].id}"]`); if (row) row.classList.add("flash");
    const b = $("#runProg"); if (b) { b.hidden = false; $("i", b).style.width = ((i + 1) / news.length * 100) + "%"; }
  }
  const k = counts(); toast(`ประมวลผล ${news.length} เอกสาร · ติดปัญหา ${k.block} · ให้คนตรวจ ${k.review} · ซ้ำ ${k.dup}`);
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT") return;
  const act = el.dataset.act, c = C(), d = el.dataset.id ? c.docs.find(x => x.id === el.dataset.id) : null;
  if (act === "tab") { S.tab = el.dataset.tab; render(); }
  else if (act === "filter") { S.filter = el.dataset.f; render(); }
  else if (act === "sel") { S.sel = el.dataset.id; render(); }
  else if (act === "run") runProcess();
  else if (act === "confirm" && d) { confirmDoc(c, d); toast(`ยืนยันแล้ว · ${d.vendor} → ${d.code}`); nextSel(); render(); }
  else if (act === "unconfirm" && d) { d.status = "ready"; render(); }
  else if (act === "request" && d) { d.status = "requested"; toast(`ส่งข้อความขอเอกสารใหม่ถึงเจ้าของกิจการทาง LINE แล้ว (สาธิต)`); render(); }
  else if (act === "notdup" && d) { d.no = d.no + " (2)"; render(); }
  else if (act === "pick" && d) { setCode(c, d, el.dataset.code); }
  else if (act === "confirmHigh") { let n = 0; for (const x of c.docs) { const a = AN[x.id]; if (x.status === "ready" && !a.review && a.conf >= 90) { confirmDoc(c, x); n++; } } toast(`ยืนยัน ${n} รายการที่มั่นใจ 90% ขึ้นไป`); render(); }
  else if (act === "reset") { S = seed(); render(); toast("รีเซ็ตข้อมูลตัวอย่างแล้ว"); }
  else if (act === "ai" && d) askAI(c, d);
  else if (act === "sampleCsv") { $("#csvText").value = SAMPLE_CSV; }
  else if (act === "parse") { parsed = parseTable($("#csvText").value); $("#mapOut").innerHTML = parsed ? mapHTML(parsed) : `<p class="muted">ไม่พบข้อมูล</p>`; }
  else if (act === "doImport" && parsed) {
    const m = parsed.map, g = (r, f) => f in m ? (r[m[f]] || "").trim() : "";
    let n = 0; for (const r of parsed.rows) { const vendor = g(r, "vendor"); if (!vendor) continue; const vat = numv(g(r, "vat")), tin = g(r, "tin").replace(/\D/g, "");
      c.docs.push({ id: c.id + "-" + (c.docs.length + 1), date: toIso(g(r, "date")), no: g(r, "no") || "-", vendor, tin, desc: g(r, "desc") || "-", base: numv(g(r, "base")), vat, wht: numv(g(r, "wht")), type: vat > 0 ? "full" : "cash", src: "Excel", buyerTin: c.tin, vatReg: true, status: "new", code: null, exported: false }); n++; }
    parsed = null; toast(`นำเข้า ${n} รายการ · กดตรวจและจัดประเภทเพื่อประมวลผล`); S.tab = "review"; render();
  }
  else if (act === "importCoa") {
    const lines = $("#coaText").value.split("\n").map(l => l.split(/[,\t]/).map(s => s.trim())).filter(a => a[0] && a[1]);
    if (!lines.length) { toast("ไม่พบรายการ ใส่ รหัส,ชื่อบัญชี บรรทัดละหนึ่งบัญชี"); return; }
    c.coa = lines.map(([code, name]) => { const old = c.coa.find(a => a[0] === code); return [code, name, old ? old[2] : name.replace(/^ค่า/, "").replace(/[()]/g, "").split(/\s+/)[0]]; });
    if (!c.coa.find(a => a[0] === c.miscCode)) c.miscCode = c.coa[c.coa.length - 1][0];
    if (!c.coa.find(a => a[0] === c.assetCode)) c.assetCode = c.coa[0][0];
    toast(`นำเข้าผังบัญชี ${c.coa.length} รหัส`); render();
  }
  else if (act === "saveRules") { c.capThreshold = +$("#capIn").value || 0; c.assetCode = $("#assetIn").value; toast("บันทึกกฎแล้ว รหัสที่เสนอคำนวณใหม่"); render(); }
  else if (act === "forget") { delete c.vendorRules[el.dataset.v]; render(); }
  else if (act === "fmt") { expFmt = el.dataset.f; render(); }
  else if (act === "copyCsv") { const csv = buildCsv(expFmt); try { await navigator.clipboard.writeText(csv); toast("คัดลอก CSV แล้ว วางใน Excel ได้เลย"); } catch (err) { toast("คัดลอกไม่ได้ในหน้าจอนี้"); } }
  else if (act === "download") {
    const csv = buildCsv(expFmt), name = `${expFmt === "peak" ? "PEAK_import" : "journal"}_${c.slug}_2569-10.csv`;
    try { await downloadsNS.save({ filename: name, data: csv }); exportRows().forEach(x => x.exported = true); toast("บันทึกไฟล์แล้ว · ทำเครื่องหมายว่าส่งออกแล้ว"); render(); }
    catch (err) { toast(err && err.code === "declined" ? "ยกเลิกการบันทึกไฟล์" : "บันทึกไฟล์ไม่ได้ในหน้าจอนี้ ใช้คัดลอก CSV แทน"); }
  }
  else if (act === "markExported") { const n = exportRows().length; exportRows().forEach(x => x.exported = true); toast(`ทำเครื่องหมาย ${n} รายการว่าส่งออกแล้ว`); render(); }
  else if (act === "unexport") { c.docs.forEach(x => x.exported = false); render(); }
});
function setCode(c, d, code) { d.code = code; d.codeEdited = true; c.vendorRules[vkey(d)] = { code, n: 1, src: "edit" }; toast(`จำไว้แล้ว: ${d.vendor} → ${code} ${coaName(c, code)}`); render(); }
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "clientSel") { S.clientId = el.value; S.sel = null; S.filter = "all"; render(); }
  else if (el.dataset && el.dataset.act === "code") { const c = C(), d = c.docs.find(x => x.id === el.dataset.id); if (d) setCode(c, d, el.value); }
  else if (el.id === "csvFile" && el.files && el.files[0]) { const fr = new FileReader(); fr.onload = () => { $("#csvText").value = String(fr.result); parsed = parseTable(fr.result); $("#mapOut").innerHTML = parsed ? mapHTML(parsed) : ""; }; fr.readAsText(el.files[0], "utf-8"); }
});
function nextSel() { const list = visibleDocs().filter(d => d.status !== "confirmed" && !AN[d.id].dupOf); const i = list.findIndex(d => d.id === S.sel); S.sel = (list[i + 1] || list[0] || {}).id || S.sel; }
document.addEventListener("keydown", e => {
  if (S.tab !== "review" || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const list = visibleDocs(), i = list.findIndex(d => d.id === S.sel);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); S.sel = (list[i + 1] || list[i] || {}).id; render(); $("#revT tr.sel")?.scrollIntoView({ block: "nearest" }); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); S.sel = (list[i - 1] || list[i] || {}).id; render(); $("#revT tr.sel")?.scrollIntoView({ block: "nearest" }); }
  else if (e.key === "Enter") { const c = C(), d = c.docs.find(x => x.id === S.sel); if (d && d.status === "ready" && !AN[d.id].dupOf && !AN[d.id].blocks) { e.preventDefault(); confirmDoc(c, d); toast(`ยืนยันแล้ว · ${d.vendor} → ${d.code}`); nextSel(); render(); } }
});
async function askAI(c, d) {
  const out = $("#aiOut"); if (!out || !sampleFn) return;
  out.textContent = "กำลังคิด…";
  const prompt = `You classify Thai business expenses into the client's own chart of accounts.
Client business: ${c.biz}. Asset capitalisation threshold: ${c.capThreshold} THB.
Chart of accounts (code: name):
${c.coa.map(a => `${a[0]}: ${a[1]}`).join("\n")}

Document:
vendor: ${d.vendor}
description: ${d.desc}
amount before VAT: ${d.base} THB, VAT: ${d.vat} THB, document type: ${d.type}

Reply ONLY with JSON: {"code": "<one code from the list>", "confidence": <0-100>, "reason_th": "<one short sentence in Thai explaining why>"}`;
  try {
    const r = await sampleFn.json(prompt, { modelTier: "quick" });
    if (!r || !c.coa.find(a => a[0] === String(r.code))) { out.textContent = "AI ตอบรหัสที่ไม่อยู่ในผังบัญชี จึงไม่นำมาใช้"; return; }
    out.innerHTML = `AI เสนอ <b>${esc(r.code)} ${esc(coaName(c, String(r.code)))}</b> (${esc(r.confidence)}%)<br>${esc(r.reason_th || "")}<br><button class="btn sm" type="button" data-act="pick" data-id="${d.id}" data-code="${esc(r.code)}" style="margin-top:6px">ใช้รหัสนี้</button>`;
  } catch (err) {
    out.textContent = err && err.code === "not_granted" ? "ไม่ได้อนุญาตให้ใช้ AI" : err && err.code === "rate_limited" ? "เรียกใช้ถี่เกินไป ลองใหม่อีกครู่" : "เรียก AI ไม่สำเร็จ ใช้รหัสที่ระบบเสนอได้ตามปกติ";
  }
}
render();
})();
</script>
